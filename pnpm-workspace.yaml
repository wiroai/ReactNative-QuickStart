packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true

auditConfig:
  ignoreGhsas:
    # deepmerge has no fixed release (4.3.1 is the latest). Only jest-config
    # uses it, to merge this repository's own Jest configuration.
    - GHSA-gcqx-w48m-w2h4

linkWorkspacePackages: true
# Patched versions of development tool dependencies that Expo, Jest,
# typescript-eslint and Vitest still pin to vulnerable releases.
overrides:
  '@xmldom/xmldom@<0.8.15': ^0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': ^0.9.12
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': ^2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': ^5.0.12
  compression: ^1.8.2
  fast-uri: ^3.1.9
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'js-yaml@<3.15.2': ^3.15.2
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  node-forge: ^1.4.3
  postcss: 8.5.26
  react-server-dom-webpack: '~19.0.9'
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2
  vite: ^8.2.4
saveWorkspaceProtocol: rolling
