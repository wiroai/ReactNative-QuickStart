name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  hermes:
    # React Native publishes the Hermes VM that runs the bundle only as a
    # macOS framework; the script links a small runner against it.
    name: Hermes HMAC
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Hermes HMAC
        run: pnpm verify:hmac:hermes

  publish:
    name: Publish to npm
    needs: hermes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          package_version="$(node -p \
            "require('./packages/wiro-react-native/package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Run release checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test
          pnpm test:coverage
          pnpm verify:exports
          pnpm expo:config
          pnpm expo:export:ios
          pnpm expo:export:android
          pnpm pack:dry-run

      - name: Publish package
        working-directory: packages/wiro-react-native
        run: npm publish --access public
